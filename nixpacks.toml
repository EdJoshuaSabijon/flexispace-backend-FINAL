[phases.setup]
nixPkgs = ["php82", "php82Packages.composer", "nodejs_20"]

[phases.install]
cmds = ["composer install --no-dev --no-interaction --prefer-dist", "npm install && npm run build"]

[phases.build]
cmds = ["php artisan key:generate --show", "php artisan storage:link", "php artisan config:cache", "php artisan route:cache", "php artisan view:cache"]

[phases.postbuild]
cmds = ["php artisan migrate --force"]

[start]
cmd = "vendor/bin/heroku-php-apache2 public/"
